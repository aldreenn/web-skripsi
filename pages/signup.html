<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | ReadQuest</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="../desain/signup.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body>
    <div class="login-wrapper">
      <form
        id="signupForm"
        action="../auth/signup.php"
        method="post"
      >
        <div class="login-header">
          <h1 class="login-title">ReadQuest</h1>
          <p class="login-subtitle">Create a new account to get started.</p>
        </div>
        <div id="warningBox" class="warning" aria-live="polite"></div>

        <div class="input-group">
          <span class="material-symbols-outlined">person</span>
          <input type="text" id="username" name="username" placeholder="Username" required />
        </div>

        <div class="input-group">
          <span class="material-symbols-outlined">badge</span>
          <input type="text" id="first_name" name="first_name" placeholder="First Name" required />
        </div>

        <div class="input-group">
          <span class="material-symbols-outlined">badge</span>
          <input type="text" id="last_name" name="last_name" placeholder="Last Name" required />
        </div>

        <div class="input-group">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" id="password" name="password" placeholder="Password" required />
          <span class="material-symbols-outlined toggle-password" data-target="password" style="display: none;">visibility_off</span>
        </div>

        <div class="input-group">
          <span class="material-symbols-outlined">lock</span>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
          />
          <span class="material-symbols-outlined toggle-password" data-target="confirm_password" style="display: none;">visibility_off</span>
        </div>

        <input type="submit" value="Register" />

        <p class="signup-hint">
          <span>Already have an account?</span>
          <a href="loginpage.html">Login here</a>
        </p>
      </form>
    </div>

    <script>
      (function () {
        const form = document.getElementById("signupForm");
        const warningBox = document.getElementById("warningBox");
        const usernameInput = document.getElementById("username");
        const firstNameInput = document.getElementById("first_name");
        const lastNameInput = document.getElementById("last_name");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirm_password");

        // Password visibility toggle logic
        document.querySelectorAll('.toggle-password').forEach(icon => {
          const targetId = icon.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if(input) {
            const toggleVisibility = () => {
              icon.style.display = input.value.length > 0 ? "block" : "none";
            };
            toggleVisibility();
            input.addEventListener("input", toggleVisibility);
            
            icon.addEventListener('click', function() {
              const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
              input.setAttribute('type', type);
              this.textContent = type === 'password' ? 'visibility_off' : 'visibility';
            });
          }
        });

        // Tampilkan pesan error dari server (query string ?error=...)
        const params = new URLSearchParams(window.location.search);
        const serverError = params.get("error");
        if (serverError) {
          showWarning(serverError);
        }

        form.addEventListener("submit", function (event) {
          const username = usernameInput.value.trim();
          const firstName = firstNameInput.value.trim();
          const lastName = lastNameInput.value.trim();
          const password = passwordInput.value.trim();
          const confirm = confirmInput.value.trim();

          if (!username || !firstName || !lastName || !password || !confirm) {
            event.preventDefault();
            showWarning("All fields are required.");
            return;
          }

          if (password !== confirm) {
            event.preventDefault();
            showWarning("Passwords do not match.");
            return;
          }

          hideWarning();
        });

        function showWarning(message) {
          warningBox.textContent = message;
          warningBox.classList.add("show");
        }

        function hideWarning() {
          warningBox.textContent = "";
          warningBox.classList.remove("show");
        }
      })();
    </script>
  </body>
</html>
